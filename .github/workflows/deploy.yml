name: Deploy

# Every push to main is tested and the Docker image is built, so a broken build
# is caught here and not on the server.
#
# The last job updates the copy that already runs on the server: it logs in over
# SSH and runs the same three commands as a manual update. It never starts a
# second copy. It is skipped until the server secrets below are set.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t creators-hub:ci .
      - name: The image starts and answers
        run: |
          docker run -d --name hub -e NODE_ENV=development -p 3000:3000 creators-hub:ci
          for attempt in $(seq 1 20); do
            curl -fsS http://localhost:3000/healthz && exit 0
            sleep 1
          done
          docker logs hub
          exit 1

  update-server:
    needs: [test, image]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_PORT: ${{ secrets.VPS_PORT }}
      VPS_PATH: ${{ secrets.VPS_PATH }}
      VPS_PASSWORD: ${{ secrets.VPS_PASSWORD }}
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
    steps:
      - name: Update the running copy
        run: |
          set -euo pipefail
          if [ -z "$VPS_HOST" ] || [ -z "$VPS_USER" ] || [ -z "$VPS_PASSWORD$VPS_SSH_KEY" ]; then
            echo "::notice::Server not updated: VPS_HOST, VPS_USER and VPS_SSH_KEY (or VPS_PASSWORD) are not set. Update by hand, see README."
            exit 0
          fi
          OPTS="-p ${VPS_PORT:-22} -o StrictHostKeyChecking=accept-new -o ConnectTimeout=30 -o ServerAliveInterval=30"
          if [ -n "$VPS_SSH_KEY" ]; then
            mkdir -p ~/.ssh && chmod 700 ~/.ssh
            printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/deploy_key && chmod 600 ~/.ssh/deploy_key
            SSH="ssh -i $HOME/.ssh/deploy_key $OPTS"
          else
            sudo apt-get update -qq && sudo apt-get install -y -qq sshpass
            export SSHPASS="$VPS_PASSWORD"
            SSH="sshpass -e ssh $OPTS"
          fi
          # The server keeps its own .env and compose override; this only refreshes code and image.
          $SSH "$VPS_USER@$VPS_HOST" "set -e
            cd ${VPS_PATH:-projects/creators-hub}
            git pull --ff-only
            docker build -t creators-hub:latest .
            cd deploy
            docker compose up -d
            sleep 5
            docker compose ps
            docker compose logs --tail 15 app"
